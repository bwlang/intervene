[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
name = "intervene"
channels = ["conda-forge", "bioconda", "tlemane"]
platforms = ["linux-64"]

[tool.pixi.tasks]
dev-install = "python -m pip install -e . --no-build-isolation"
test = "intervene --help"

[tool.pixi.dependencies]
python = "3.12.*"
pybedtools = ">=0.12.0,<0.13"
pandas = ">=3.0.1,<4"
numpy = ">=2.4.2,<3"
scipy = ">=1.17.0,<2"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
pip = ">=26.0.1,<27"
r-upsetr = ">=1.4.0,<2"
upsetplot = ">=0.9.0,<0.10"
